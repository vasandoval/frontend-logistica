<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehiculos - LogiTrans</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>

     <nav class="navbar">
        <div class="nav-logo">
            <span class="logo-texto">LOGITRANS <strong>EXPRESS</strong></span>
        </div>
        <ul class="nav-links">
            <li><a href="conductores.html">Conductores</a></li>
            <li><a href="vehiculos.html">Vehículos</a></li>
            <li><a href="rutas.html">Rutas</a></li>
            <li><a href="viajes.html">Viajes</a></li>
        </ul>
    </nav>

    <h1>Vehículos</h1>
    <section class="content">
        <form name="VehiculoForm">
            <h2>Registrar Vehículo</h2>
            <div>
                <label for="placa">Placa:</label>
                <input type="text" name="placa">
                <p id="msgPlaca" class="inputError">Campo Obligatorio.</p>
            </div>
            <div>
                <label for="tipo_vehiculo">Tipo de Vehículo:</label>
                <input type="text" name="tipo_vehiculo">
                <p id="msgTipo" class="inputError">Campo Obligatorio.</p>
            </div>
            <div>
                <label for="capacidad_carga">Capacidad de Carga:</label>
                <input type="text" name="capacidad_carga">
                <p id="msgCapacidad" class="inputError">Campo Obligatorio.</p>
            </div>
            <div>
                <label for="modelo">Modelo:</label>
                <input type="text" name="modelo">
            </div>
            <div>
                <label for="marca">Marca:</label>
                <input type="text" name="marca">
            </div>
            <div class="button">
                <button type="reset">Cancelar</button>
                <button type="submit">Guardar</button>
            </div>
        </form>

        <table id="vehiculoTB">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Placa</th>
                    <th>Tipo</th>
                    <th>Capacidad</th>
                    <th>Modelo</th>
                    <th>Marca</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="7">No hay registros...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <script src="js/modal.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/vehiculos.js"></script>
    <script src="js/vehiculo_form.js"></script>

    <nav class="navbar">
        <!-- <div class="nav-logo">
            <span class="logo-texto">LOGITRANS <strong>EXPRESS</strong></span>
        </div> -->
        <ul class="nav-links">
            <li><a href="index.html">Volver al inicio</a></li>
        </ul>
        <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
    </nav>

</body>
</html>
