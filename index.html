<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrans Express</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <span class="logo-texto">LOGITRANS <strong>EXPRESS</strong></span>
        </div>
        <ul class="nav-links">
            <li><a href="conductores.html">Conductores</a></li>
            <li><a href="vehiculos.html">Vehículos</a></li>
            <li><a href="rutas.html">Rutas</a></li>
            <li><a href="viajes.html">Viajes</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-contenido">
            <h1>Control total de<br><span>transporte de carga</span></h1>
            <p>Gestiona conductores, vehículos, rutas y viajes desde una sola plataforma.</p>
            <button class="btn-abrir-login" id="btnAbrirLogin">Iniciar sesión</button>
        </div>
    </section>

    <div id="modalLogin" class="modal-login-overlay oculto">
        <div class="modal-login-caja">
            <h2>Iniciar sesión</h2>
            <form name="InicioSesion">
                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" name="usuario" placeholder="admin">
                    <p id="msgInputUsuario" class="inputError">Campo Obligatorio.</p>
                </div>
                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" name="contrasena" placeholder="••••••••">
                    <p id="msgInputContra" class="inputError">Campo Obligatorio.</p>
                </div>
                <div class="login-buttons">
                    <button type="reset">Cancelar</button>
                    <button type="submit">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal1" class="modal close">
        <div class="modal__cuerpo">
            <p class="modal__texto">OK</p>
            <button class="modal__btn">Aceptar</button>
        </div>
    </div>

    <script src="js/modal.js"></script>
    <script src="js/sesion.js"></script>
</body>
</html>
